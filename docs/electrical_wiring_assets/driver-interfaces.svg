<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs><style>.bg{fill:#f7f7f5}.box{fill:#fff;stroke:#334f59;stroke-width:2}.logic{fill:#e7f1f4;stroke:#17677a;stroke-width:2}.power{fill:#fbe8e8;stroke:#ae3434;stroke-width:2}.t{font:700 22px 'DejaVu Sans',sans-serif;fill:#17333d}.s{font:16px 'DejaVu Sans',sans-serif;fill:#38535c}.tiny{font:14px 'DejaVu Sans',sans-serif;fill:#536b73}.line{stroke:#244b5a;stroke-width:4;fill:none;marker-end:url(#a)}.p{stroke:#bd2f2f;stroke-width:5;fill:none;marker-end:url(#r)}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#244b5a"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#bd2f2f"/></marker></defs>
  <rect class="bg" width="1400" height="760" rx="24"/><text class="t" x="700" y="46" text-anchor="middle">Why external drivers and interface stages are required</text>
  <text class="t" x="350" y="95" text-anchor="middle">STEP/DIR stepper path</text>
  <rect class="logic" x="55" y="140" width="210" height="105" rx="14"/><text class="t" x="160" y="180" text-anchor="middle">ESP32-S3</text><text class="s" x="160" y="213" text-anchor="middle">3.3 V logic pulses</text>
  <rect class="box" x="360" y="120" width="260" height="145" rx="14"/><text class="t" x="490" y="160" text-anchor="middle">Opto / transistor interface</text><text class="s" x="490" y="193" text-anchor="middle">logic isolation / sinking</text><text class="tiny" x="490" y="225" text-anchor="middle">verify polarity on installed driver</text>
  <rect class="power" x="715" y="105" width="270" height="175" rx="14"/><text class="t" x="850" y="147" text-anchor="middle">BM860 or TB6600</text><text class="s" x="850" y="180" text-anchor="middle">microstep current driver</text><text class="s" x="850" y="213" text-anchor="middle">48 V or 19 V motor supply</text><text class="tiny" x="850" y="245" text-anchor="middle">current/DIP settings from nameplate</text>
  <rect class="box" x="1080" y="140" width="260" height="105" rx="14"/><text class="t" x="1210" y="180" text-anchor="middle">Stepper motor</text><text class="s" x="1210" y="213" text-anchor="middle">NEMA34 or NEMA23</text>
  <path class="line" d="M265 192H360"/><path class="line" d="M620 192H715"/><path class="p" d="M985 192H1080"/>

  <text class="t" x="700" y="350" text-anchor="middle">BLD-750 low-side control interface</text>
  <rect class="logic" x="55" y="400" width="210" height="150" rx="14"/><text class="t" x="160" y="440" text-anchor="middle">ESP32 GPIO</text><text class="s" x="160" y="475" text-anchor="middle">13 BRK · 14 EN · 15 F/R</text><text class="tiny" x="160" y="510" text-anchor="middle">HIGH turns transistor ON</text>
  <rect class="box" x="360" y="385" width="260" height="180" rx="14"/><text class="t" x="490" y="425" text-anchor="middle">One PN2222 per input</text><text class="s" x="490" y="460" text-anchor="middle">1–2.2 kΩ base resistor</text><text class="s" x="490" y="493" text-anchor="middle">10 kΩ base-to-emitter</text><text class="tiny" x="490" y="528" text-anchor="middle">collector → BLD input; emitter → COM</text>
  <rect class="power" x="715" y="385" width="270" height="180" rx="14"/><text class="t" x="850" y="425" text-anchor="middle">BLD-750</text><text class="s" x="850" y="460" text-anchor="middle">BRK · EN · F/R inputs</text><text class="s" x="850" y="493" text-anchor="middle">SV analog speed input</text><text class="tiny" x="850" y="528" text-anchor="middle">motor phase control stays inside driver</text>
  <rect class="box" x="1080" y="400" width="260" height="150" rx="14"/><text class="t" x="1210" y="440" text-anchor="middle">BLDC motor</text><text class="s" x="1210" y="475" text-anchor="middle">48 V traction power</text><text class="tiny" x="1210" y="510" text-anchor="middle">high-current phase wiring</text>
  <path class="line" d="M265 475H360"/><path class="line" d="M620 475H715"/><path class="p" d="M985 475H1080"/>

  <rect class="box" x="300" y="630" width="800" height="85" rx="14"/><text class="s" x="700" y="663" text-anchor="middle">A driver is the power electronics between low-energy controller logic and a high-current motor.</text><text class="tiny" x="700" y="692" text-anchor="middle">GP8630N is a DAC, and PN2222 is an interface transistor; neither replaces the motor driver.</text>
</svg>
