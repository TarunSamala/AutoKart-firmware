<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <style>
      .bg{fill:#f4f7f8}.box{fill:#fff;stroke:#244b5a;stroke-width:2}.core{fill:#dbeff3;stroke:#0c6574;stroke-width:3}.safe{fill:#fff1e6;stroke:#bd5c22;stroke-width:3}.sensor{fill:#eef4e6;stroke:#54743a;stroke-width:2}.power{fill:#f5eaf7;stroke:#765386;stroke-width:2}.t{font:700 22px 'DejaVu Sans',sans-serif;fill:#17333d}.s{font:16px 'DejaVu Sans',sans-serif;fill:#38535c}.tiny{font:14px 'DejaVu Sans',sans-serif;fill:#536b73}.line{stroke:#244b5a;stroke-width:4;fill:none;marker-end:url(#a)}.feedback{stroke:#54743a;stroke-width:3;fill:none;stroke-dasharray:8 7;marker-end:url(#g)}.stop{stroke:#bd2f2f;stroke-width:5;fill:none;marker-end:url(#r)}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#244b5a"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#54743a"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#bd2f2f"/></marker>
  </defs>
  <rect class="bg" width="1400" height="850" rx="24"/>
  <text class="t" x="700" y="48" text-anchor="middle">AutoKart control, sensing and safety architecture</text>

  <rect class="box" x="45" y="100" width="250" height="105" rx="14"/>
  <text class="t" x="170" y="140" text-anchor="middle">HP60C RGB-D</text><text class="s" x="170" y="173" text-anchor="middle">USB camera</text>
  <rect class="box" x="45" y="270" width="250" height="105" rx="14"/>
  <text class="t" x="170" y="310" text-anchor="middle">WR850N</text><text class="s" x="170" y="343" text-anchor="middle">9 V router / dashboard LAN</text>

  <rect class="core" x="420" y="105" width="300" height="200" rx="18"/>
  <text class="t" x="570" y="150" text-anchor="middle">Jetson Orin Nano Super</text>
  <text class="s" x="570" y="185" text-anchor="middle">Perception · dashboard · planning</text>
  <text class="s" x="570" y="218" text-anchor="middle">HP60C USB host</text>
  <text class="s" x="570" y="251" text-anchor="middle">ESP32 USB serial at 115200</text>

  <rect class="core" x="420" y="430" width="300" height="235" rx="18"/>
  <text class="t" x="570" y="475" text-anchor="middle">ESP32-S3 N16R8 VCU</text>
  <text class="s" x="570" y="510" text-anchor="middle">Local actuator control</text>
  <text class="s" x="570" y="543" text-anchor="middle">Sensor acquisition</text>
  <text class="s" x="570" y="576" text-anchor="middle">LoRa STOP receiver</text>
  <text class="s" x="570" y="609" text-anchor="middle">Safe-state command logic</text>

  <rect class="box" x="850" y="75" width="270" height="120" rx="14"/>
  <text class="t" x="985" y="113" text-anchor="middle">Steering</text><text class="s" x="985" y="145" text-anchor="middle">BM860 → NEMA34</text><text class="tiny" x="985" y="173" text-anchor="middle">AS5600 feedback</text>
  <rect class="box" x="850" y="245" width="270" height="145" rx="14"/>
  <text class="t" x="985" y="283" text-anchor="middle">Traction</text><text class="s" x="985" y="315" text-anchor="middle">GP8630N → BLD-750 → BLDC</text><text class="tiny" x="985" y="345" text-anchor="middle">AS5047P on 14T sprocket</text><text class="tiny" x="985" y="372" text-anchor="middle">14T → 44T axle</text>
  <rect class="box" x="850" y="445" width="270" height="125" rx="14"/>
  <text class="t" x="985" y="484" text-anchor="middle">Mechanical brake</text><text class="s" x="985" y="518" text-anchor="middle">TB6600 → NEMA23</text><text class="tiny" x="985" y="546" text-anchor="middle">Open-loop; no brake encoder</text>

  <rect class="safe" x="1165" y="500" width="200" height="140" rx="14"/>
  <text class="t" x="1265" y="538" text-anchor="middle">Remote STOP</text><text class="s" x="1265" y="572" text-anchor="middle">RP2040 Pico</text><text class="s" x="1265" y="603" text-anchor="middle">LAY37 + RA-02</text>
  <rect class="safe" x="850" y="700" width="515" height="105" rx="14"/>
  <text class="t" x="1107" y="738" text-anchor="middle">Independent hardwired series safety chain</text>
  <text class="s" x="1107" y="772" text-anchor="middle">12 V fuse → ON/OFF → NC E-stop(s) → DC contactor coil</text>

  <path class="line" d="M295 152 H420"/><text class="tiny" x="345" y="137">USB</text>
  <path class="line" d="M295 322 H370 V265 H420"/><text class="tiny" x="320" y="307">Ethernet</text>
  <path class="line" d="M570 305 V430"/><text class="tiny" x="590" y="375">USB serial</text>
  <path class="line" d="M720 485 H790 V135 H850"/><text class="tiny" x="746" y="120">STEP/DIR</text>
  <path class="feedback" d="M850 165 H805 V525 H720"/><text class="tiny" x="735" y="507">I²C angle</text>
  <path class="line" d="M720 535 H820 V320 H850"/><text class="tiny" x="750" y="304">SV + digital</text>
  <path class="feedback" d="M850 355 H830 V575 H720"/><text class="tiny" x="738" y="595">SPI angle</text>
  <path class="line" d="M720 610 H790 V510 H850"/><text class="tiny" x="742" y="495">STEP/DIR</text>
  <path class="stop" d="M1165 570 H1120"/><text class="tiny" x="1118" y="554" text-anchor="end">433 MHz STOP packet</text>
  <path class="stop" d="M1165 610 H760 V630 H720"/>
  <path class="stop" d="M1107 700 V640"/><text class="tiny" x="1125" y="676">cuts 48 V traction path</text>
</svg>
