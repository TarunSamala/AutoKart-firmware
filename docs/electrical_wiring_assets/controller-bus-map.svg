<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840">
  <defs><style>.bg{fill:#f4f7f8}.core{fill:#dbeff3;stroke:#0c6574;stroke-width:3}.dev{fill:#fff;stroke:#334f59;stroke-width:2}.bad{fill:#feecec;stroke:#b52d2d;stroke-width:3}.t{font:700 22px 'DejaVu Sans',sans-serif;fill:#17333d}.s{font:16px 'DejaVu Sans',sans-serif;fill:#38535c}.tiny{font:14px 'DejaVu Sans',sans-serif;fill:#536b73}.i2c{stroke:#17677a;stroke-width:5;fill:none}.spi{stroke:#765386;stroke-width:5;fill:none}.ctl{stroke:#3f7437;stroke-width:5;fill:none}.usb{stroke:#244b5a;stroke-width:5;fill:none;stroke-dasharray:10 7}</style></defs>
  <rect class="bg" width="1400" height="840" rx="24"/><text class="t" x="700" y="46" text-anchor="middle">ESP32-S3 N16R8 bus and GPIO allocation</text>
  <rect class="core" x="500" y="100" width="400" height="640" rx="22"/><text class="t" x="700" y="145" text-anchor="middle">ESP32-S3 N16R8</text>
  <text class="s" x="700" y="185" text-anchor="middle">GPIO1/2 · steering I²C</text><text class="s" x="700" y="225" text-anchor="middle">GPIO4/5 · steering STEP/DIR</text><text class="s" x="700" y="265" text-anchor="middle">GPIO6 · steering ENA allocated</text><text class="s" x="700" y="305" text-anchor="middle">GPIO7/21 · GP8630N I²C</text><text class="s" x="700" y="345" text-anchor="middle">GPIO8–12/17 · RA-02 SPI</text><text class="s" x="700" y="385" text-anchor="middle">GPIO13/14/15 · BLD controls</text><text class="s" x="700" y="425" text-anchor="middle">GPIO16/18/41/42 · AS5047 SPI</text><text class="s" x="700" y="465" text-anchor="middle">GPIO19/20 · native USB</text><text class="s" x="700" y="505" text-anchor="middle">GPIO38/39/40 · brake STEP/DIR/ENA</text><text class="s" x="700" y="545" text-anchor="middle">GPIO0/3/45/46 · reserved straps</text><text class="s" x="700" y="585" text-anchor="middle">GPIO26–37 · flash/PSRAM reserve</text><text class="s" x="700" y="625" text-anchor="middle">GPIO47 · future isolated stop request</text><text class="s" x="700" y="665" text-anchor="middle">GPIO48 · status LED optional</text>

  <rect class="dev" x="70" y="105" width="280" height="105" rx="14"/><text class="t" x="210" y="145" text-anchor="middle">Steering AS5600</text><text class="s" x="210" y="180" text-anchor="middle">SDA1 · SCL2 · 0x36</text>
  <rect class="dev" x="70" y="270" width="280" height="105" rx="14"/><text class="t" x="210" y="310" text-anchor="middle">BM860 steering driver</text><text class="s" x="210" y="345" text-anchor="middle">STEP4 · DIR5 · ENA6</text>
  <rect class="dev" x="70" y="435" width="280" height="105" rx="14"/><text class="t" x="210" y="475" text-anchor="middle">GP8630N DAC</text><text class="s" x="210" y="510" text-anchor="middle">SDA7 · SCL21 · 0x58</text>
  <rect class="dev" x="70" y="600" width="280" height="105" rx="14"/><text class="t" x="210" y="640" text-anchor="middle">BLD-750 controls</text><text class="s" x="210" y="675" text-anchor="middle">BRK13 · EN14 · F/R15</text>

  <rect class="dev" x="1050" y="105" width="280" height="105" rx="14"/><text class="t" x="1190" y="145" text-anchor="middle">RA-02 receiver</text><text class="s" x="1190" y="180" text-anchor="middle">8/9/10/11/12/17</text>
  <rect class="dev" x="1050" y="270" width="280" height="105" rx="14"/><text class="t" x="1190" y="310" text-anchor="middle">AS5047P</text><text class="s" x="1190" y="345" text-anchor="middle">CS16 · SCK18 · MOSI41 · MISO42</text>
  <rect class="dev" x="1050" y="435" width="280" height="105" rx="14"/><text class="t" x="1190" y="475" text-anchor="middle">TB6600 brake driver</text><text class="s" x="1190" y="510" text-anchor="middle">STEP38 · DIR39 · ENA40</text>
  <rect class="dev" x="1050" y="600" width="280" height="105" rx="14"/><text class="t" x="1190" y="640" text-anchor="middle">Jetson USB serial</text><text class="s" x="1190" y="675" text-anchor="middle">native USB GPIO19/20</text>

  <path class="i2c" d="M350 157H500"/><path class="ctl" d="M350 322H500"/><path class="i2c" d="M350 487H500"/><path class="ctl" d="M350 652H500"/>
  <path class="spi" d="M900 157H1050"/><path class="spi" d="M900 322H1050"/><path class="ctl" d="M900 487H1050"/><path class="usb" d="M900 652H1050"/>

  <rect class="bad" x="390" y="760" width="620" height="58" rx="12"/><text class="s" x="700" y="795" text-anchor="middle">GPIO35/36 are PSRAM data pins on N16R8: do not wire a brake AS5600 there.</text>
</svg>
