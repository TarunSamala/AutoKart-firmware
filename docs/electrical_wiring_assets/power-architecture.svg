<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830">
  <defs><style>
    .bg{fill:#f7f7f5}.b48{fill:#fbe8e8;stroke:#ae3434;stroke-width:3}.b12{fill:#fff2d9;stroke:#a56811;stroke-width:3}.load{fill:#fff;stroke:#334f59;stroke-width:2}.logic{fill:#e7f1f4;stroke:#17677a;stroke-width:2}.t{font:700 22px 'DejaVu Sans',sans-serif;fill:#17333d}.s{font:16px 'DejaVu Sans',sans-serif;fill:#38535c}.tiny{font:14px 'DejaVu Sans',sans-serif;fill:#536b73}.p48{stroke:#bd2f2f;stroke-width:6;fill:none;marker-end:url(#r)}.p12{stroke:#c17c17;stroke-width:6;fill:none;marker-end:url(#o)}.p19{stroke:#17677a;stroke-width:5;fill:none;marker-end:url(#b)}.g{stroke:#35484e;stroke-width:3;fill:none;stroke-dasharray:9 7}.warn{fill:#fff7e8;stroke:#c88925;stroke-width:2}
  </style><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#bd2f2f"/></marker><marker id="o" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#c17c17"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#17677a"/></marker></defs>
  <rect class="bg" width="1400" height="830" rx="24"/><text class="t" x="700" y="46" text-anchor="middle">Two-battery power architecture and branch protection</text>
  <rect class="b48" x="55" y="110" width="235" height="110" rx="16"/><text class="t" x="172" y="153" text-anchor="middle">48 V battery</text><text class="s" x="172" y="187" text-anchor="middle">traction / actuators</text>
  <rect class="load" x="365" y="95" width="245" height="135" rx="15"/><text class="t" x="487" y="133" text-anchor="middle">Main protection</text><text class="s" x="487" y="166" text-anchor="middle">fuse + service disconnect</text><text class="s" x="487" y="198" text-anchor="middle">+ DC contactor poles</text>
  <rect class="load" x="725" y="70" width="240" height="105" rx="15"/><text class="t" x="845" y="110" text-anchor="middle">BLD-750</text><text class="s" x="845" y="143" text-anchor="middle">BLDC power stage</text>
  <rect class="load" x="1055" y="70" width="260" height="105" rx="15"/><text class="t" x="1185" y="110" text-anchor="middle">BM860</text><text class="s" x="1185" y="143" text-anchor="middle">NEMA34 steering driver</text>
  <rect class="logic" x="725" y="245" width="240" height="115" rx="15"/><text class="t" x="845" y="285" text-anchor="middle">48 V → 19 V buck</text><text class="s" x="845" y="319" text-anchor="middle">rated, fused, filtered</text>
  <rect class="load" x="1055" y="220" width="260" height="100" rx="15"/><text class="t" x="1185" y="258" text-anchor="middle">Jetson Orin Nano</text><text class="s" x="1185" y="290" text-anchor="middle">19 V DC jack branch</text>
  <rect class="load" x="1055" y="350" width="260" height="100" rx="15"/><text class="t" x="1185" y="388" text-anchor="middle">TB6600 + NEMA23</text><text class="s" x="1185" y="420" text-anchor="middle">19 V brake branch</text>

  <rect class="b12" x="55" y="500" width="235" height="110" rx="16"/><text class="t" x="172" y="543" text-anchor="middle">12 V battery</text><text class="s" x="172" y="577" text-anchor="middle">safety / accessories</text>
  <rect class="load" x="365" y="475" width="245" height="150" rx="15"/><text class="t" x="487" y="513" text-anchor="middle">Series button chain</text><text class="s" x="487" y="547" text-anchor="middle">branch fuse → ON/OFF</text><text class="s" x="487" y="578" text-anchor="middle">→ NC E-stop → coil</text><text class="tiny" x="487" y="605" text-anchor="middle">manual reset; no software dependency</text>
  <rect class="load" x="725" y="465" width="240" height="105" rx="15"/><text class="t" x="845" y="503" text-anchor="middle">12 V beacon</text><text class="s" x="845" y="536" text-anchor="middle">separately fused</text>
  <rect class="logic" x="725" y="620" width="240" height="105" rx="15"/><text class="t" x="845" y="658" text-anchor="middle">12 V → 9 V buck</text><text class="s" x="845" y="691" text-anchor="middle">router supply</text>
  <rect class="load" x="1055" y="620" width="260" height="105" rx="15"/><text class="t" x="1185" y="658" text-anchor="middle">TP-Link WR850N</text><text class="s" x="1185" y="691" text-anchor="middle">9 V DC, verify polarity</text>

  <path class="p48" d="M290 165H365"/><path class="p48" d="M610 145H725"/><path class="p48" d="M610 165H680V122H1055"/><path class="p48" d="M610 190H680V302H725"/>
  <path class="p19" d="M965 302H1010V270H1055"/><path class="p19" d="M965 302H1010V400H1055"/>
  <path class="p12" d="M290 555H365"/><path class="p12" d="M610 540H725"/><path class="p12" d="M610 585H680V672H725"/><path class="p12" d="M965 672H1055"/>
  <path class="g" d="M172 220V770H1280"/><text class="tiny" x="190" y="790">Returns remain branch-sized; signal reference is bonded deliberately at the control interface, not through sensor cables.</text>
  <rect class="warn" x="55" y="685" width="560" height="95" rx="12"/><text class="s" x="75" y="718">Do not choose fuse, cable, buck or contactor ratings from this diagram.</text><text class="tiny" x="75" y="747">Battery short-circuit current, motor/driver nameplates, inrush and measured load are still required.</text>
</svg>
