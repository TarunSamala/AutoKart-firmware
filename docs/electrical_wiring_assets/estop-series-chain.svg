<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
  <defs><style>.bg{fill:#f7f7f5}.box{fill:#fff;stroke:#334f59;stroke-width:2}.safe{fill:#fff1e6;stroke:#bd5c22;stroke-width:3}.power{fill:#fbe8e8;stroke:#ae3434;stroke-width:3}.t{font:700 22px 'DejaVu Sans',sans-serif;fill:#17333d}.s{font:16px 'DejaVu Sans',sans-serif;fill:#38535c}.tiny{font:14px 'DejaVu Sans',sans-serif;fill:#536b73}.line{stroke:#bd2f2f;stroke-width:6;fill:none;marker-end:url(#r)}.radio{stroke:#765386;stroke-width:4;fill:none;stroke-dasharray:9 7;marker-end:url(#p)}</style><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#bd2f2f"/></marker><marker id="p" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#765386"/></marker></defs>
  <rect class="bg" width="1400" height="640" rx="24"/><text class="t" x="700" y="46" text-anchor="middle">Hardwired contactor chain plus supplementary LoRa stop</text>
  <rect class="safe" x="45" y="105" width="190" height="100" rx="14"/><text class="t" x="140" y="145" text-anchor="middle">12 V battery</text><text class="s" x="140" y="178" text-anchor="middle">coil supply</text>
  <rect class="box" x="300" y="105" width="190" height="100" rx="14"/><text class="t" x="395" y="145" text-anchor="middle">Branch fuse</text><text class="s" x="395" y="178" text-anchor="middle">near battery</text>
  <rect class="safe" x="555" y="105" width="190" height="100" rx="14"/><text class="t" x="650" y="145" text-anchor="middle">ON/OFF</text><text class="s" x="650" y="178" text-anchor="middle">maintained switch</text>
  <rect class="safe" x="810" y="105" width="190" height="100" rx="14"/><text class="t" x="905" y="145" text-anchor="middle">E-stop NC</text><text class="s" x="905" y="178" text-anchor="middle">series contact</text>
  <rect class="power" x="1065" y="105" width="275" height="100" rx="14"/><text class="t" x="1202" y="145" text-anchor="middle">12 V DC contactor coil</text><text class="s" x="1202" y="178" text-anchor="middle">manual power authorization</text>
  <path class="line" d="M235 155H300"/><path class="line" d="M490 155H555"/><path class="line" d="M745 155H810"/><path class="line" d="M1000 155H1065"/>
  <text class="tiny" x="700" y="245" text-anchor="middle">Any open switch or broken series wire de-energizes the coil. Use coil suppression if it is not built in.</text>

  <rect class="power" x="120" y="315" width="240" height="105" rx="14"/><text class="t" x="240" y="355" text-anchor="middle">48 V battery</text><text class="s" x="240" y="388" text-anchor="middle">traction energy</text>
  <rect class="power" x="540" y="300" width="320" height="135" rx="14"/><text class="t" x="700" y="340" text-anchor="middle">Main contactor poles</text><text class="s" x="700" y="373" text-anchor="middle">open when coil drops</text><text class="tiny" x="700" y="404" text-anchor="middle">interrupt the approved 48 V traction branch</text>
  <rect class="power" x="1040" y="315" width="240" height="105" rx="14"/><text class="t" x="1160" y="355" text-anchor="middle">BLD-750 / BM860</text><text class="s" x="1160" y="388" text-anchor="middle">48 V loads</text>
  <path class="line" d="M360 367H540"/><path class="line" d="M860 367H1040"/>

  <rect class="box" x="160" y="505" width="260" height="90" rx="14"/><text class="t" x="290" y="540" text-anchor="middle">RP2040 Pico + LAY37</text><text class="s" x="290" y="570" text-anchor="middle">RA-02 transmitter</text>
  <rect class="box" x="570" y="505" width="260" height="90" rx="14"/><text class="t" x="700" y="540" text-anchor="middle">ESP32-S3 + RA-02</text><text class="s" x="700" y="570" text-anchor="middle">supplementary receiver</text>
  <rect class="box" x="980" y="505" width="260" height="90" rx="14"/><text class="t" x="1110" y="540" text-anchor="middle">Software full lock</text><text class="s" x="1110" y="570" text-anchor="middle">DAC 0 · EN stop · brakes</text>
  <path class="radio" d="M420 550H570"/><path class="radio" d="M830 550H980"/>
</svg>
