<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
<style>
.b{fill:#123d32;stroke:#071d18;stroke-width:9}.m{fill:#222a2e;stroke:#e3efe7;stroke-width:3}.p{fill:#d6a83f;stroke:#352608;stroke-width:2}.t{fill:#eff8f1;font:19px Arial}.s{fill:#b8d1bf;font:15px Arial}.h{fill:#fff;font:bold 29px Arial}.tr{fill:none;stroke-width:7;stroke-linecap:square;stroke-linejoin:miter}.g{stroke:#8e9aa0}.r{stroke:#ff4c4c}.c{stroke:#33c7ff}.y{stroke:#ffd43b}.v{stroke:#bd7bff}.o{stroke:#ff9f1c}.q{stroke:#32d583}.z{stroke:#ff65b5}.tag{fill:#0a241c;stroke:#8fc3a0;stroke-width:2}.warn{fill:#3b2d11;stroke:#e4b747;stroke-width:2}.via{fill:#f5f5f5;stroke:#111;stroke-width:3}
</style>
<rect width="1500" height="1000" fill="#0b1518"/>
<rect x="25" y="25" width="1450" height="950" rx="24" class="b"/>
<text x="750" y="68" text-anchor="middle" class="h">OPTIMIZED RA-02 + XIAO C3 PCB ROUTING</text>
<text x="750" y="96" text-anchor="middle" class="s">RA-02 TOP • XIAO C3 BOTTOM • straight underside signal tracks • top power/ground plane</text>

<!-- modules -->
<rect x="585" y="130" width="330" height="160" rx="12" class="m"/>
<text x="750" y="205" text-anchor="middle" class="h">RA-02</text>
<text x="750" y="235" text-anchor="middle" class="s">female PCB sockets</text>
<rect x="585" y="700" width="330" height="170" rx="12" class="m"/>
<text x="750" y="780" text-anchor="middle" class="h">XIAO ESP32-C3</text>
<text x="750" y="810" text-anchor="middle" class="s">female PCB sockets</text>

<!-- RA02 socket reference points -->
<g>
<circle cx="500" cy="150" r="11" class="p"/><text x="465" y="157" text-anchor="end" class="t">GND</text>
<circle cx="500" cy="180" r="11" class="p"/><text x="465" y="187" text-anchor="end" class="t">GND</text>
<circle cx="500" cy="210" r="11" class="p"/><text x="465" y="217" text-anchor="end" class="t">3.3V</text>
<circle cx="500" cy="240" r="11" class="p"/><text x="465" y="247" text-anchor="end" class="t">RST</text>
<circle cx="500" cy="270" r="11" class="p"/><text x="465" y="277" text-anchor="end" class="t">DIO0</text>
<circle cx="1000" cy="150" r="11" class="p"/><text x="1035" y="157" class="t">GND</text>
<circle cx="1000" cy="180" r="11" class="p"/><text x="1035" y="187" class="t">NSS</text>
<circle cx="1000" cy="210" r="11" class="p"/><text x="1035" y="217" class="t">MOSI</text>
<circle cx="1000" cy="240" r="11" class="p"/><text x="1035" y="247" class="t">MISO</text>
<circle cx="1000" cy="270" r="11" class="p"/><text x="1035" y="277" class="t">SCK</text>
</g>

<!-- C3 socket reference points: official physical side order -->
<g>
<circle cx="500" cy="720" r="11" class="p"/><text x="465" y="727" text-anchor="end" class="t">D0</text>
<circle cx="500" cy="750" r="11" class="p"/><text x="465" y="757" text-anchor="end" class="t">D1</text>
<circle cx="500" cy="780" r="11" class="p"/><text x="465" y="787" text-anchor="end" class="t">D2</text>
<circle cx="500" cy="810" r="11" class="p"/><text x="465" y="817" text-anchor="end" class="t">D3</text>
<circle cx="500" cy="840" r="11" class="p"/><text x="465" y="847" text-anchor="end" class="t">D4</text>
<circle cx="500" cy="870" r="11" class="p"/><text x="465" y="877" text-anchor="end" class="t">D5</text>
<circle cx="1000" cy="720" r="11" class="p"/><text x="1035" y="727" class="t">VBUS</text>
<circle cx="1000" cy="750" r="11" class="p"/><text x="1035" y="757" class="t">GND</text>
<circle cx="1000" cy="780" r="11" class="p"/><text x="1035" y="787" class="t">3V3</text>
<circle cx="1000" cy="810" r="11" class="p"/><text x="1035" y="817" class="t">D10</text>
<circle cx="1000" cy="840" r="11" class="p"/><text x="1035" y="847" class="t">D9</text>
<circle cx="1000" cy="870" r="11" class="p"/><text x="1035" y="877" class="t">D8</text>
<circle cx="1000" cy="900" r="11" class="p"/><text x="1035" y="907" class="t">D7</text>
</g>

<!-- optimized straight underside routes -->
<!-- common GND rail -->
<path d="M500 150 H350 V930 H1160 V750 H1000" class="tr g"/>
<path d="M500 180 H380 V930" class="tr g"/>
<path d="M1000 150 H1160 V750" class="tr g"/>
<!-- 3V3 rail on top layer, shown dashed -->
<path d="M500 210 H300 V650 H1180 V780 H1000" class="tr r" stroke-dasharray="12 10"/>
<!-- short right-side SPI -->
<path d="M1000 210 H1090 V810 H1000" class="tr q"/>
<path d="M1000 240 H1120 V900 H1000" class="tr c"/>
<!-- SCK uses outer right lane and enters D5 -->
<path d="M1000 270 H1280 V950 H420 V870 H500" class="tr y"/>
<!-- NSS uses outer left lane and enters D3 -->
<path d="M1000 180 H1330 V610 H250 V810 H500" class="tr o"/>
<!-- RST/DIO0 use separate left fanout lanes; X1 resolves order crossing -->
<path d="M500 240 H210 V560 H430 V780 H500" class="tr c"/>
<path d="M500 270 H170 V590 H400 V750 H500" class="tr v"/>
<circle cx="430" cy="560" r="9" class="via"/><text x="445" y="555" class="s">X1 layer change</text>
<!-- LAY37 -->
<path d="M500 840 H300 V950 H150" class="tr z"/>
<path d="M150 950 H350 V930" class="tr g"/>
<circle cx="130" cy="950" r="11" class="p"/><text x="160" y="957" class="t">LAY37 NC</text>
<circle cx="130" cy="915" r="11" class="p"/><text x="160" y="922" class="t">LAY37 COM → GND</text>

<!-- design notes -->
<rect x="570" y="925" width="820" height="38" rx="8" class="warn"/>
<text x="590" y="950" class="s">OPTIMIZATION: continuous GND plane • short SPI • outer lanes for NSS/SCK • one marked crossover only</text>
<text x="750" y="100" text-anchor="middle" class="s">Blue/green/yellow = underside signal traces • dashed red = top-layer 3V3 rail</text>
</svg>
